name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} / CPU
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          python -m pip install ".[test]"

      - name: Run offline test suite
        run: >-
          python -m pytest -m "not release"
          --cov=rosetta_copy
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        run: python -m build

      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c "import rosetta_copy; assert rosetta_copy.list_variants() == ('s224', 's336')"
          rosetta-copy --help
